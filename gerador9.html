<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gerador de Flashcards Anki</title>
<style>
  :root{
    --bg:#000000;                 
    --bg-2:#0B0B0C;               
    --surface:#1C1C1E;            
    --surface-hover:#2C2C2E;      
    --border:#3A3A3C;             
    --border-light:#48484A;       
    --text:#FFFFFF;               
    --text-muted:#98989D;         
    --text-dim:#636366;           
    --primary:#10A37F;            
    --primary-hover:#11B48B;      
    --primary-veil: rgba(16,163,127,0.18);
    --success:#30D158;            
    --danger:#FF453A;             
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.45), 0 2px 4px -1px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 10px 20px -3px rgba(0,0,0,0.5), 0 6px 10px -2px rgba(0,0,0,0.4);
    --radius: 12px;
    --radius-lg: 16px;

    /* Cabeçalho da questão */
    --q-header-h: 2.6rem;
    --q-header-pb: 0.45rem;
    --q-header-pi: 1.25rem;
    --q-header-inner-h: calc(var(--q-header-h) - 2 * var(--q-header-pb));

    /* Altura coerente entre INPUT e TEXTAREA (1 linha) */
    --field-pv: .625rem; /* padding vertical */
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; padding:0;
    background:linear-gradient(135deg,var(--bg) 0%,var(--bg-2) 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',systemui,sans-serif;
    font-size:15px; line-height:1.6; min-height:100vh;
  }
  .container{ max-width:1200px; margin:0 auto; padding:1.25rem 1rem; }

  .header{
    display:flex; align-items:center; justify-content:space-between;
    gap:1rem; padding:.75rem 0; margin-bottom:1rem;
    border-bottom:1px solid var(--border);
  }
  .header h1{ font-size:1.375rem; font-weight:600; letter-spacing:.2px; margin:0; color:var(--text); }
  .header-actions{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
  .status-pill{
    display:inline-flex; align-items:center; gap:.5rem;
    padding:.35rem .75rem; border:1px solid var(--border);
    border-radius:999px; font-size:.8125rem; color:var(--text-dim);
  }

  .btn{
    display:inline-flex; align-items:center; gap:.5rem;
    padding:.6rem 1rem; border:1px solid var(--border);
    border-radius:var(--radius); background:var(--surface); color:var(--text);
    font-size:.875rem; font-weight:500; cursor:pointer; transition:all .2s;
    text-decoration:none;
  }
  .btn:hover{ background:var(--surface-hover); border-color:var(--border-light); }
  .btn:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--primary-veil); border-color:var(--primary-hover); }
  .btn-accent{ background:var(--primary-veil); color:var(--primary); border-color:transparent; }
  .btn-success{ background:var(--success); border-color:var(--success); color:#000; }
  .btn-danger{ background:var(--danger); border-color:var(--danger); color:#000; }
  .btn-small{ padding:.45rem .65rem; font-size:.8rem; }
  .btn-ghost{ background:transparent; border-color:var(--border); }

  /* Campos */
  .form-label{
    display:block; 
    font-size:.8125rem;
    font-weight:600; 
    color:var(--text-muted);
    margin-bottom:.35rem;
  }
  .form-input,.form-textarea{
    width:100%; display:block; margin:0;
    padding: var(--field-pv) .7rem;                 /* padding igual para input e textarea */
    background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius);
    color:var(--text); font-size:.875rem; line-height:1.4;
    transition:border-color .2s, box-shadow .2s;
  }
  .form-input:focus,.form-textarea:focus{ outline:none; border-color:var(--primary-hover); box-shadow:0 0 0 3px var(--primary-veil); }

  /* TEXTAREA com altura inicial idêntica ao INPUT e autoexpansão */
  .form-textarea{
    min-height: calc(1.4em + (var(--field-pv) * 2) + 2px); /* 1 linha + paddings + borda */
    overflow:hidden;     /* sem scroll; cresce via JS */
    resize:vertical;     /* opcional: permite ajustar manualmente */
  }

  .form-help{ font-size:.8rem; color:var(--text-dim); margin-top:.25rem; }

  .question-card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); box-shadow:0 2px 4px rgba(0,0,0,.35);
    margin-bottom:1rem; overflow:hidden; animation:slideIn .3s ease-out;
  }

  .question-header{
    display:flex; align-items:center; justify-content:space-between;
    padding-block: var(--q-header-pb);
    padding-inline: var(--q-header-pi);
    background:linear-gradient(135deg,var(--surface-hover) 0%,var(--surface) 100%);
    border-bottom:1px solid var(--border);
    height: var(--q-header-h);
    cursor: pointer;
    user-select: none;
  }
  .question-header:focus-visible{
    outline:none; box-shadow:0 0 0 3px var(--primary-veil) inset; border-color:var(--primary-hover);
    border-bottom-color:var(--primary-hover);
  }
  .question-header .question-actions, 
  .question-header .question-actions *{ cursor: pointer; }

  .question-title{
    font-size:1rem; font-weight:600; color:var(--text); margin:0;
    display:inline-flex; align-items:center; gap:.5rem; user-select:none;
    line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  }
  .question-title .chev{ transition:transform .2s, opacity .2s; opacity:.8; }
  .question-card.collapsed .question-title .chev{ transform:rotate(-90deg); opacity:.95; }

  .question-actions{ display:flex; gap:.4rem; }
  .question-actions .btn{
    height: var(--q-header-inner-h);
    padding-block: 0;
    display:inline-flex; align-items:center;
  }

  .question-body{ padding:1rem; }

  .question-card.collapsed .question-body{ display:none; }
  .question-card.collapsed .question-actions{ display:none; }
  .question-card.collapsed .question-header{ border-bottom:1px dashed var(--border); }
  .question-card.collapsed{ box-shadow:none; }

  .form-grid{ display:grid; grid-template-columns:1fr; }
  .form-group{ padding-top:.5rem; }
  .form-group:first-child{ padding-top:0; }

  .comment-tools{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.5rem; }
  .image-preview{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.5rem; }
  .image-pill{
    display:flex; align-items:center; gap:.45rem; padding:.4rem .6rem;
    background:var(--surface-hover);
    border:1px solid var(--border-light); border-radius:50px; font-size:.75rem;
  }
  .filename{ font-family:'Monaco','Menlo','Ubuntu Mono',monospace; color:var(--text-muted); background:var(--primary-veil);
    padding:.15rem .35rem; border-radius:4px; }

  /* --- PRÉVIA: manter o título no lugar ao abrir --- */
  .preview-section{ margin-top:.75rem; } /* não altera padding/borda ao abrir */
  .preview-toggle{
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    font-size:.875rem; padding:.4rem 0; display:inline-flex; align-items:center;
  }
  /* remove o marcador padrão do <summary> para não "puxar" layout */
  .preview-toggle::-webkit-details-marker{ display:none; }
  .preview-toggle::marker{ content:''; }

  /* Quando abrir, o separador vai DENTRO do conteúdo, abaixo do summary */
  details[open] .preview-content{
    margin-top:.20rem;
    padding-top:.0rem;
    border-top:0px dashed var(--border);/* linha removida */
  /* ou simplesmente apague a linha do border-top */
  }
  .preview-content{ display:grid; gap:.8rem; }
  .preview-box{ background:var(--surface-hover); border:1px solid var(--border); border-radius:var(--radius); padding:.85rem; }
  .preview-label{ font-size:.78rem; color:var(--text-dim); margin-bottom:.4rem; }

  .footer-actions{ position:sticky; bottom:0; background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.94) 20%); padding:2rem 0 1rem 0; margin-top:3rem; }
  .footer-content{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1.5rem;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; box-shadow:var(--shadow-lg);
  }
  .footer-info{ display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
  .info-text{ font-size:.8rem; color:var(--text-dim); }
  .separator-hint{ background:var(--primary-veil); color:var(--primary); padding:.2rem .5rem; border-radius:4px; font-family:'Monaco','Menlo','Ubuntu Mono',monospace; }

  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }

  @media (max-width:768px){
    .container{ padding:1rem .75rem; }
    .header{ flex-direction:column; align-items:flex-start; padding:.75rem 0; }
    .header h1{ font-size:1.25rem; }
    .header-actions{ width:100%; justify-content:flex-start; gap:.5rem; }

    .question-header{
      flex-direction:column; gap:.6rem;
      align-items:flex-start; padding:.6rem 1rem;
      height:auto;
    }
    .question-body{ padding:.85rem; }
    .question-actions .btn{ height:auto; padding-block:.45rem; }
  }

  @keyframes slideIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  html{ scrollbar-gutter:stable; overflow-y:scroll; }
</style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Gerador de Flashcards Anki</h1>
      <div class="header-actions">
        <button id="connectAnkiBtn" class="btn btn-accent">📁 Conectar pasta do Anki</button>
        <div id="ankiStatus" class="status-pill"><span>Status: não conectado</span></div>
      </div>
    </header>

    <div id="questions"></div>

    <div class="footer-actions">
      <div class="footer-content">
        <div class="footer-info">
          <button class="btn" id="addQuestionBtn">➕ Nova Questão</button>
          <span class="info-text">Use <span class="separator-hint">Ctrl+V</span> para colar imagens</span>
        </div>
        <div class="footer-info">
          <span class="info-text">Separador: <span class="separator-hint">;</span></span>
          <button class="btn btn-success" id="generateBtn">📄 Gerar TXT</button>
        </div>
      </div>
    </div>

    <template id="question-template">
      <div class="question-card" data-q>
        <div class="question-header" aria-expanded="true" role="button" tabindex="0" title="Clique para recolher/expandir esta questão. Shift+clique: recolhe as outras.">
          <h3 class="question-title">Questão <span data-idx></span></h3>
          <div class="question-actions">
            <button type="button" class="btn btn-small btn-ghost" data-dup>📋 Duplicar</button>
            <button type="button" class="btn btn-small btn-ghost" data-rem>🗑️ Remover</button>
          </div>
        </div>

        <div class="question-body" id="body-__IDX__">
          <div class="form-grid">
            <!-- 1) ASSUNTO -->
            <div class="form-group">
              <label class="form-label">
                ASSUNTO
                <span class="assunto-suggestions" data-assunto-sugs style="display:none"></span>
              </label>
              <input class="form-input" data-assunto type="text" placeholder="Ex.: Direito Constitucional">
            </div>

            <!-- 2) QUESTÃO (1 linha + autoexpansão com altura igual ao INPUT) -->
            <div class="form-group">
              <label class="form-label">QUESTÃO</label>
              <textarea class="form-textarea" data-qline placeholder="Copie a questão do Agente" rows="1"></textarea>
            </div>

            <!-- 3) COMENTÁRIOS E IMAGENS (1 linha + autoexpansão com altura igual ao INPUT) -->
            <div class="form-group">
              <label class="form-label">COMENTÁRIOS E IMAGENS</label>
              <textarea
                class="form-textarea"
                data-comments
                placeholder="Digite seus comentários. Cole imagens com Ctrl+V ou arraste arquivos."
                rows="1"
              ></textarea>

              <div class="comment-tools">
                <input type="file" class="sr-only" accept="image/*" data-file />
                <button type="button" class="btn btn-small" data-choose>📷 Escolher imagem</button>
                <button type="button" class="btn btn-small btn-ghost" data-pastehint title="Cole imagem">💡 Cole imagem</button>
              </div>

              <div class="image-preview" data-imgs></div>
            </div>
          </div>

          <div class="preview-section">
            <details>
              <summary class="preview-toggle">🔍 VER PRÉVIA DO FLASHCARD</summary>
              <div class="preview-content">
                <div class="preview-box">
                  <div class="preview-label">Conteúdo renderizado:</div>
                  <div data-htmlpreview></div>
                </div>
              </div>
            </details>
          </div>
        </div>
      </div>
    </template>
  </div>

<script>
(() => {
  let qCounter = 0;
  let ankiDirHandle = null;

  /* ===== Persistência do handle (IndexedDB) + Autoconexão ===== */
  const IDB_DB = 'ankiFS';
  const IDB_STORE = 'handles';
  const IDB_KEY = 'anki-media';

  const idbOpen = () => new Promise((res, rej) => {
    const req = indexedDB.open(IDB_DB, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
  const idbGet = async (key) => {
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const st = tx.objectStore(IDB_STORE);
      const req = st.get(key);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  };
  const idbSet = async (key, val) => {
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.objectStore(IDB_STORE).put(val, key);
    });
  };
  const idbDel = async (key) => {
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.objectStore(IDB_STORE).delete(key);
    });
  };

  // ===== Verificação sem criar arquivos =====
  async function connectAndVerify(handle){
    try{
      // Garante permissão de leitura/escrita
      let perm = await handle.queryPermission?.({mode:'readwrite'});
      if (perm !== 'granted'){
        perm = await handle.requestPermission?.({mode:'readwrite'});
        if (perm !== 'granted') return false;
      }

      // Verificação leve: iterar entradas (sem escrever)
      try {
        if (handle.entries) {
          const it = handle.entries();
          if (typeof it?.next === 'function') { /* ok: iterable síncrono */ }
          else { for await (const _ of handle.entries()) break; }
        }
      } catch(_) {}

      return true;
    }catch(e){
      console.warn('Verificação sem escrita falhou:', e);
      return false;
    }
  }

  async function autoConnectAnkiDir(){
    try{
      const saved = await idbGet(IDB_KEY);
      if(!saved) return;
      const ok = await connectAndVerify(saved);
      if(ok){
        ankiDirHandle = saved;
        document.querySelector('#ankiStatus').innerHTML = `<span>✅ Conectado automaticamente</span>`;
        updateAllPreviews && updateAllPreviews();
      }else{
        await idbDel(IDB_KEY);
      }
    }catch(e){
      console.warn('Auto-connect falhou:', e);
    }
  }

  const $  = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

  const randomName = (ext='png')=>{
    const now=new Date(); const pad=n=> String(n).padStart(2,'0');
    const stamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    const rand=Math.random().toString(36).slice(2,8);
    return `img_${stamp}_${rand}.${ext}`;
  };
  const sanitizeOneLine = (s)=> (s ?? '').replace(/\r?\n|\r/g,' ').replace(/\s+/g,' ').trim();
  const splitIntoFields = (lineRaw)=>{
    const line=lineRaw ?? '';
    const parts=line.split(';');
    if(parts.length<4){ while(parts.length<4) parts.push(''); }
    const f1=parts[0], f2=parts[1], f3=parts[2], f4=parts.slice(3).join(';');
    return [f1,f2,f3,f4];
  };

  /* ===== Comentários: quebras e imagens ===== */
  const processCommentsText=(text)=>{
    if(!text) return '';
    const lines=String(text).replace(/\r\n/g,'\n').split('\n');
    const isImgLine=(s)=> /^\s*<img\s+[^>]*>\s*$/.test(s);
    const out=[]; let i=0;
    while(i<lines.length){
      const cur=lines[i];
      if(cur.trim()===''){ let j=i; while(j<lines.length && lines[j].trim()==='') j++; if(j-i>=1) out.push('<br><br>'); i=j; continue; }
      if(isImgLine(cur)){ out.push(cur.trim()); i++; continue; }
      out.push(cur.trim());
      if(i+1<lines.length){ const next=lines[i+1]; if(next.trim()!=='' && !isImgLine(next)) out.push('<br>'); }
      i++;
    }
    return out.join('').replace(/(?:<br>){3,}/g,'<br><br>');
  };

  const normalizeImageSpacing=(content)=>{
    if(!content || !content.includes('<img')) return content;
    content=content.replace(/<img[^>]*>/g,(img,offset,str)=>{
      const start=offset, end=offset+img.length;
      const before=str.slice(0,start), after=str.slice(end);
      const needBefore=!before.endsWith('<br><br>');
      const needAfter =!after.startsWith('<br><br>');
      return (needBefore?'<br><br>':'') + img + (needAfter?'<br><br>':'');
    });
    return content.replace(/(?:<br>){3,}/g,'<br><br>');
  };

  const removeLastSegment=(f4, seg)=>{
    const f4n=normalizeImageSpacing(f4 || '');
    const segn=normalizeImageSpacing(seg || '');
    if(!segn) return f4n;
    const idx=f4n.lastIndexOf(segn);
    if(idx===-1) return f4n;
    return (f4n.slice(0,idx) + f4n.slice(idx+segn.length));
  };

  async function saveBlobToAnki(filename, blob){
    if(!ankiDirHandle) throw new Error('Pasta do Anki não conectada.');
    const fileHandle=await ankiDirHandle.getFileHandle(filename,{create:true});
    const w=await fileHandle.createWritable(); await w.write(blob); await w.close();
    return true;
  }

  /* ===== Rich paste ===== */
  const NEAR_BLACK_CHANNEL_MAX=26, NEAR_BLACK_LUMA_MAX=14;
  const ensureColorProbe=()=>{ if(!ensureColorProbe._el){ const el=document.createElement('span'); el.style.position='fixed'; el.style.top='-9999px'; el.style.visibility='hidden'; document.body.appendChild(el); ensureColorProbe._el=el; el.style.color='rgb(1,2,3)'; ensureColorProbe._sent=getComputedStyle(el).color; } return ensureColorProbe._el; };
  const parseToRGBA=(raw)=>{ try{ if(!raw) return null; const el=ensureColorProbe(); el.style.color='rgb(1,2,3)'; const sentinel=ensureColorProbe._sent; el.style.color=String(raw); const css=getComputedStyle(el).color||''; if(!css||css===sentinel) return null; const m=css.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)(?:\s*,\s*([0-9]*\.?[0-9]+))?\s*\)/i); if(!m) return null; return [+m[1],+m[2],+m[3], m[4]!==undefined?+m[4]:1]; }catch{ return null; } };
  const isNearBlackColor=(raw)=>{ const rgba=parseToRGBA(raw); if(!rgba) return false; const [r,g,b,a]=rgba; if(a===0) return true; const maxc=Math.max(r,g,b); const luma=0.2126*r + 0.7152*g + 0.0722*b; return (maxc<=NEAR_BLACK_CHANNEL_MAX) || (luma<=NEAR_BLACK_LUMA_MAX); };
  const extractNonBlackColor=(el)=>{ if(!(el instanceof Element)) return null; const style=el.getAttribute('style')||''; const m=style.match(/color\s*:\s*([^;]+)/i); if(m){ const c=m[1].trim(); if(!isNearBlackColor(c)) return c; } const attr=el.getAttribute('color'); if(attr && !isNearBlackColor(attr)) return attr.trim(); return null; };
  const getBoldDirective=(el)=>{ if(!(el instanceof Element)) return 0; const tag=el.tagName.toLowerCase(); if(tag==='b'||tag==='strong') return +1; const style=el.getAttribute('style')||''; const m=style.match(/font-weight\s*:\s*([^;]+)/i); if(!m) return 0; const v=m[1].trim().toLowerCase(); if(v==='bold'||v==='bolder') return +1; if(v==='normal'||v==='lighter') return -1; const num=parseInt(v,10); if(!isNaN(num)){ if(num>=600) return +1; if(num<=500) return -1; } return 0; };
  const getItalicDirective=(el)=>{ if(!(el instanceof Element)) return 0; const tag=el.tagName.toLowerCase(); if(tag==='i'||tag==='em') return +1; const style=el.getAttribute('style')||''; const m=style.match(/font-style\s*:\s*([^;]+)/i); if(!m) return 0; const v=m[1].trim().toLowerCase(); if(v==='italic'||'oblique') return +1; if(v==='normal') return -1; return 0; };
  const getUnderlineDirective=(el)=>{ if(!(el instanceof Element)) return 0; const tag=el.tagName.toLowerCase(); if(tag==='u') return +1; const style=el.getAttribute('style')||''; const mLine=style.match(/text-decoration-line\s*:\s*([^;]+)/i); if(mLine){ const v=mLine[1].toLowerCase(); if(/\bunderline\b/.test(v)) return +1; if(/\bnone\b/.test(v)) return -1; } const m=style.match(/text-decoration\s*:\s*([^;]+)/i); if(m){ const v=m[1].toLowerCase(); if(/\bunderline\b/.test(v)) return +1; if(/\bnone\b/.test(v)) return -1; } return 0; };

  const sanitizeRichHtmlForComments=(html)=>{
    try{
      const doc=new DOMParser().parseFromString(html,'text/html'); const segments=[];
      const push=(t,b,i,u,c)=>{ if(!t) return; if(/^[\s\u00A0]+$/.test(t)){ const last=segments[segments.length-1]; if(last && !last.bold && !last.italic && !last.underline && last.color==null) last.text+=t; else segments.push({text:t,bold:false,italic:false,underline:false,color:null}); return; } const last=segments[segments.length-1]; if(last && last.bold===b && last.italic===i && last.underline===u && last.color===c) last.text+=t; else segments.push({text:t,bold:b,italic:i,underline:u,color:c}); };
      const walk=(n,B=false,I=false,U=false,C=null,root=false)=>{
        if(n.nodeType===Node.TEXT_NODE){ push(n.nodeValue||'',B,I,U,C); return; }
        if(n.nodeType!==Node.ELEMENT_NODE) return;
        const el=n, name=el.tagName.toLowerCase();
        const b=getBoldDirective(el), i=getItalicDirective(el), u=getUnderlineDirective(el);
        const NB=b===+1?true:b===-1?false:B, NI=i===+1?true:i===-1?false:I, NU=u===+1?true:u===-1?false:U;
        const color=extractNonBlackColor(el); const NC=color!=null?color:C;
        const blocks=['p','div','section','article','header','footer','aside','h1','h2','h3','h4','h5','h6','blockquote'];
        if(name==='br'){ push('\n',false,false,false,null); return; }
        if(name==='li'){ Array.from(el.childNodes).forEach(c=>walk(c,NB,NI,NU,NC)); push('\n',false,false,false,null); return; }
        if(blocks.includes(name)){ const before=segments.length; Array.from(el.childNodes).forEach(c=>walk(c,NB,NI,NU,NC)); if(!root && segments.length>before) push('\n\n',false,false,false,null); return; }
        if(name==='img') return;
        if(name==='a'){ Array.from(el.childNodes).forEach(c=>walk(c,NB,NI,NU,NC)); return; }
        Array.from(el.childNodes).forEach(c=>walk(c,NB,NI,NU,NC));
      };
      Array.from(doc.body.childNodes).forEach(c=>walk(c,false,false,false,null,true));
      const wrap=(t,b,i,u)=>{ if(b) t=`<b>${t}</b>`; if(i) t=`<i>${t}</i>`; if(u) t=`<u>${t}</u>`; return t; };
      let out=segments.map(s=>{ let t=s.text.replace(/\u00A0/g,' '); if(t==='\n'||t==='\n\n') return t; if(/^[\s]+$/.test(t)) return t; t=wrap(t,s.bold,s.italic,s.underline); if(s.color) t=`<span style="color:${s.color}">${t}</span>`; return t; }).join('');
      out=out.replace(/^\n+|\n+$/g,'')
             .replace(/<b>\s*<\/b>/g,'')
             .replace(/<i>\s*<\/i>/g,'')
             .replace(/<u>\s*<\/u>/g,'');
      while(/<b>\s*<b>/.test(out)||/<\/b>\s*<\/b>/.test(out)) out=out.replace(/<b>\s*<b>/g,'<b>').replace(/<\/b>\s*<\/b>/g,'</b>');
      while(/<i>\s*<i>/.test(out)||/<\/i>\s*<\/i>/.test(out)) out=out.replace(/<i>\s*<i>/g,'<i>').replace(/<\/i>\s*<\/i>/g,'</i>');
      while(/<u>\s*<u>/.test(out)||/<\/u>\s*<\/u>/.test(out)) out=out.replace(/<u>\s*<u>/g,'<u>').replace(/<\/u>\s*<\/u>/g,'</u>');
      return out;
    }catch{ return ''; }
  };

  const insertAtCursor=(ta,str)=>{
    const start=ta.selectionStart ?? ta.value.length;
    const end  =ta.selectionEnd   ?? ta.value.length;
    const before=ta.value.slice(0,start), after=ta.value.slice(end);
    ta.value=before+str+after; const pos=(before+str).length; ta.selectionStart=ta.selectionEnd=pos;
  };

  /* ===== Sugestões de assunto ===== */
  const computeAssuntosBefore=(target)=>{
    const uniques=[]; const seen=new Set(); const nodes=$$('#questions [data-q]');
    for(const q of nodes){ if(q===target) break; const inp=q._assunto||$('[data-assunto]',q); const val=(inp?.value||'').trim(); if(!val) continue; if(!seen.has(val)){ seen.add(val); uniques.push(val); } }
    return uniques;
  };
  const renderAssuntoSuggestionsFor=(node)=>{
    const cont=$('[data-assunto-sugs]',node); if(!cont) return;
    const list=computeAssuntosBefore(node); cont.innerHTML='';
    if(list.length===0){ cont.style.display='none'; return; }
    cont.style.display='inline-flex';
    for(const text of list){
      const btn=document.createElement('button'); btn.type='button'; btn.className='assunto-chip'; btn.textContent=text;
      btn.addEventListener('click',()=>{ if(node._assunto){ node._assunto.value=text; node._assunto.focus(); node._sync && node._sync(); }});
      cont.appendChild(btn);
    }
  };
  const updateAllAssuntoSuggestions=()=>{ $$('#questions [data-q]').forEach(renderAssuntoSuggestionsFor); };

  /* ===== Add Question ===== */
  function addQuestion(prefill){
    const tpl=$('#question-template');
    const node=tpl.content.firstElementChild.cloneNode(true);
    qCounter++; node.dataset.id=qCounter; $('[data-idx]',node).textContent=qCounter;

    const qline=$('[data-qline]',node);
    const assunto=$('[data-assunto]',node);
    const comments=$('[data-comments]',node);
    const fileInput=$('[data-file]',node);
    const chooseBtn=$('[data-choose]',node);
    const imgs=$('[data-imgs]',node);
    const htmlPreview=$('[data-htmlpreview]',node);

    /* Chevron no título */
    const titleEl=$('.question-title',node);
    if(!titleEl.querySelector('.chev')){
      const chev=document.createElement('span'); chev.className='chev'; chev.textContent='▾'; titleEl.prepend(chev);
    }

    /* Cabeçalho clicável + acessível */
    const headerEl=$('.question-header',node);
    const updateAria = () => {
      headerEl.setAttribute('aria-expanded', String(!node.classList.contains('collapsed')));
    };
    updateAria();

    headerEl.addEventListener('click',(e)=>{
      if(e.target.closest('.question-actions')) return;
      if(e.shiftKey){
        $$('#questions [data-q]').forEach(card=>{
          if(card===node) card.classList.remove('collapsed');
          else card.classList.add('collapsed');
        });
      }else{
        node.classList.toggle('collapsed');
      }
      updateAria();
    });
    headerEl.addEventListener('keydown',(e)=>{
      if(e.target.closest('.question-actions')) return;
      if(e.key==='Enter' || e.key===' '){
        e.preventDefault();
        node.classList.toggle('collapsed');
        updateAria();
      }else if(e.key==='ArrowLeft'){
        node.classList.add('collapsed'); updateAria();
      }else if(e.key==='ArrowRight'){
        node.classList.remove('collapsed'); updateAria();
      }
    });

    const images=[]; let lastCommentsSegment=''; let isSyncing=false;

    if(prefill?.qline) qline.value=prefill.qline;
    if(prefill?.assunto) assunto.value=prefill.assunto;
    if(prefill?.comments) comments.value=prefill.comments;

    /* Autoexpansão sempre respeitando a min-height (igual ao INPUT) */
    const autoresize = (ta, max=600) => {
      ta.style.height = 'auto';
      const minH = parseFloat(getComputedStyle(ta).minHeight) || 0;
      ta.style.height = Math.min(max, Math.max(minH, ta.scrollHeight)) + 'px';
    };
    autoresize(qline); autoresize(comments);

    function syncQlineToFinal(){
      if(isSyncing) return; isSyncing=true;
      const baseLine=sanitizeOneLine(qline.value);
      let [f1,f2,f3,f4]=splitIntoFields(baseLine);
      const assuntoVal=sanitizeOneLine(assunto.value);
      if(assuntoVal) f2=assuntoVal;

      let baseF4=removeLastSegment(f4||'', lastCommentsSegment);
      const commentsText=comments.value||'';
      const newSegment=commentsText.trim()? normalizeImageSpacing('<br><br>'+processCommentsText(commentsText)) : '';
      lastCommentsSegment=newSegment;
      let field4=normalizeImageSpacing(baseF4 + newSegment);

      const finalLine=sanitizeOneLine(`${(f1||'').trim()};${(f2||'').trim()};${(f3||'').trim()};${field4}`);
      const displayValue=(finalLine===';;;') ? '' : finalLine;
      if(qline.value!==displayValue){ qline.value=displayValue; autoresize(qline); }

      const field4Rendered=(field4||'').replaceAll('&lt;','<').replaceAll('&gt;','>').replaceAll('&amp;','&');
      htmlPreview.innerHTML=field4Rendered;

      isSyncing=false;
    }

    chooseBtn.addEventListener('click',()=>fileInput.click());
    fileInput.addEventListener('change',async (e)=>{
      const f=e.target.files?.[0]; if(!f) return;
      await addImageBlob(f); fileInput.value=''; autoresize(comments); syncQlineToFinal();
    });

    comments.addEventListener('paste', async (e)=>{
      const items=e.clipboardData?.items||[]; let handled=false;
      for(const it of items){
        if(it.type && it.type.startsWith('image/')){
          const file=it.getAsFile();
          if(file){ await addImageBlob(file); handled=true; }
        }
      }
      if(handled){ e.preventDefault(); autoresize(comments); syncQlineToFinal(); return; }
      const html=e.clipboardData?.getData('text/html');
      if(html){
        const sanitized=sanitizeRichHtmlForComments(html);
        if(sanitized){ e.preventDefault(); insertAtCursor(comments, sanitized); autoresize(comments); syncQlineToFinal(); return; }
      }
    });

    /* Drag & Drop direto no textarea */
    comments.addEventListener('dragover', e=>{ e.preventDefault(); comments.style.borderColor='var(--primary)'; });
    comments.addEventListener('dragleave', e=>{ comments.style.borderColor='var(--border)'; });
    comments.addEventListener('drop', async e=>{
      e.preventDefault(); comments.style.borderColor='var(--border)';
      const files=e.dataTransfer?.files||[];
      for(const f of files){ if(f.type?.startsWith('image/')) await addImageBlob(f); }
      autoresize(comments);
      syncQlineToFinal();
    });

    async function addImageBlob(file){
      const ext=(file.type==='image/jpeg')?'jpg' : (file.type==='image/webp')?'webp' : (file.type==='image/gif')?'gif' : 'png';
      const name=randomName(ext); const blob=file;

      let saved=false, errorMsg='';
      if(ankiDirHandle){ try{ await saveBlobToAnki(name, blob); saved=true; } catch{ errorMsg=' (falha ao salvar)'; } }

      images.push({blob,name,saved});

      const ta=comments;
      const selStart=ta.selectionStart ?? ta.value.length;
      const selEnd  =ta.selectionEnd   ?? ta.value.length;

      const before=ta.value.slice(0,selStart);
      const after =ta.value.slice(selEnd);

      const needsNLBefore = before && !before.endsWith('\n');
      const needsNLAfter  = after  && !after.startsWith('\n');

      const insert = `${needsNLBefore?'\n':''}<img src="${name}">${needsNLAfter?'\n':''}`;

      ta.value = before + insert + after;

      const newPos=(before+insert).length;
      ta.selectionStart=ta.selectionEnd=newPos;

      /* Autoexpansão após inserir imagem */
      autoresize(ta);

      const pill=document.createElement('div');
      pill.className='image-pill';
      pill.innerHTML=`
        <span class="filename">${name}</span>
        <button type="button" class="btn btn-small" data-save>💾</button>
        <a class="btn btn-small" data-dl download="${name}">⬇️</a>
        <button type="button" class="btn btn-small btn-danger" data-remove title="Remover imagem">❌</button>
        <span class="info-text" data-state>${saved?'✅ salvo':('⏳ pendente'+errorMsg)}</span>
      `;

      $('[data-save]',pill).addEventListener('click', async ()=>{
        try{
          if(!ankiDirHandle){ alert('Conecte a pasta do Anki primeiro.'); return; }
          await saveBlobToAnki(name, blob);
          $('[data-state]',pill).textContent='✅ salvo';
          const obj=images.find(x=>x.name===name);
          if(obj) obj.saved=true;
        }catch{ alert('Erro ao salvar a imagem.'); }
      });

      const dl=$('[data-dl]',pill);
      const url=URL.createObjectURL(blob);
      dl.href=url;

      $('[data-remove]',pill).addEventListener('click', ()=>{
        if(confirm(`Remover a imagem ${name}?`)) {
          const idx=images.findIndex(img=>img.name===name);
          if(idx>-1) images.splice(idx,1);
          ta.value=ta.value.replace(new RegExp(`\\s*<img\\s+src=["']${name}["']\\s*>\\s*`,'g'),'\n');
          pill.remove();
          URL.revokeObjectURL(url);
          autoresize(ta);
          syncQlineToFinal();
        }
      });

      imgs.appendChild(pill);
    }

    comments.addEventListener('input', ()=>{ autoresize(comments); syncQlineToFinal(); });
    assunto.addEventListener('input', ()=>{ syncQlineToFinal(); updateAllAssuntoSuggestions(); });
    qline.addEventListener('input', ()=>{ autoresize(qline); if(!isSyncing) syncQlineToFinal(); });

    $('[data-dup]',node).addEventListener('click', ()=>{
      const cloned=collectData(node);
      addQuestion({qline:cloned.finalLine, assunto:cloned.assunto, comments:cloned.commentsText});
      updateAllPreviews(); updateAllAssuntoSuggestions();
      window.scrollTo({top: node.offsetTop, behavior:'smooth'});
    });
    $('[data-rem]',node).addEventListener('click', ()=>{
      if(confirm('Remover esta questão?')){
        node.remove(); renumber(); updateAllPreviews(); updateAllAssuntoSuggestions();
      }
    });

    function collectData(){
      syncQlineToFinal();
      const uiValue=sanitizeOneLine(qline.value);
      let [f1,f2,f3,f4]=splitIntoFields(uiValue);

      const assuntoVal=sanitizeOneLine(assunto.value);
      if(assuntoVal) f2=assuntoVal;

      const commentsText=comments.value||'';
      const commentsSeg=commentsText.trim()? normalizeImageSpacing('<br><br>'+processCommentsText(commentsText)) : '';

      let field4=normalizeImageSpacing(removeLastSegment(f4||'', lastCommentsSegment) + commentsSeg);

      const finalLine=sanitizeOneLine(`${(f1||'').trim()};${(f2||'').trim()};${(f3||'').trim()};${field4}`);

      const field4Rendered=(field4||'').replaceAll('&lt;','<').replaceAll('&gt;','>').replaceAll('&amp;','&');

      lastCommentsSegment=commentsSeg;

      return { finalLine, field4Rendered, baseLine: finalLine, assunto: assuntoVal, commentsText: comments.value || '' };
    }

    node._collect=()=>collectData();
    node._updatePreview=()=>syncQlineToFinal();
    node._getImages=()=>images;
    node._assunto=assunto;
    node._sync=syncQlineToFinal;

    $('#questions').appendChild(node);
    syncQlineToFinal();
    updateAllAssuntoSuggestions();
    return node;
  }

  function renumber(){ $$('#questions [data-q]').forEach((q,i)=>{ q.dataset.id=i+1; $('[data-idx]',q).textContent=i+1; }); }
  function updateAllPreviews(){ $$('#questions [data-q]').forEach(q=> q._updatePreview && q._updatePreview()); }

  // ====== Conectar manualmente (sem criar arquivo de teste) ======
  document.querySelector('#connectAnkiBtn').addEventListener('click', async ()=>{
    try{
      const handle=await window.showDirectoryPicker({id:'anki-media'});

      const ok = await connectAndVerify(handle);
      if(!ok){ document.querySelector('#ankiStatus').innerHTML=`<span>❌ Permissão negada</span>`; return; }

      ankiDirHandle=handle;

      // Salva o handle no IndexedDB
      try{ await idbSet(IDB_KEY, handle); }catch(e){ console.warn('Falha ao salvar handle no IDB', e); }

      // Solicita armazenamento persistente (opcional)
      try{ if(navigator.storage?.persist) await navigator.storage.persist(); }catch(_e){}

      document.querySelector('#ankiStatus').innerHTML=`<span>✅ Conectado com sucesso</span>`;
      updateAllPreviews();
      alert('✅ Pasta do Anki conectada! Imagens serão salvas automaticamente.');
    }catch(err){
      console.warn('Permissão negada/cancelada', err);
      document.querySelector('#ankiStatus').innerHTML=`<span>❌ Não conectado</span>`;
    }
  });

  // ===== Auto-conectar (sem criar arquivo) =====
  autoConnectAnkiDir();

  addQuestion();

  document.querySelector('#addQuestionBtn').addEventListener('click', ()=>{
    addQuestion();
    window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
  });

  document.querySelector('#generateBtn').addEventListener('click', async ()=>{
    if(ankiDirHandle){
      const all=$$('#questions [data-q]');
      for(const q of all){
        const images=q._getImages ? q._getImages() : [];
        for(const img of images){
          if(!img.saved){
            try{ await saveBlobToAnki(img.name,img.blob); img.saved=true; }
            catch(err){ console.warn('Falha ao salvar imagem:', img.name); }
          }
        }
      }
    }
    const lines=$$('#questions [data-q]').map(q=>q._collect().finalLine).filter(Boolean);
    if(!lines.length){ alert('⚠️ Nenhuma questão válida para gerar.'); return; }

    const txt=lines.join('\r\n\r\n') + '\r\n';
    const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
    const dt=new Date(); const pad=n=> String(n).padStart(2,'0');
    const fname=`flashcards_${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}_${pad(dt.getHours())}${pad(dt.getMinutes())}.txt`;

    if(window.showSaveFilePicker){
      try{
        const handle=await window.showSaveFilePicker({ suggestedName: fname, types:[{description:'TXT', accept:{'text/plain':['.txt']}}] });
        const w=await handle.createWritable(); await w.write(blob); await w.close();
        alert('✅ TXT gerado com sucesso!');
        return;
      }catch(e){}
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a);
    a.click(); a.remove(); URL.revokeObjectURL(url);
  });

})();
</script>
</body>
